services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3001"
      APP_URL: ${APP_URL:?APP_URL is required}
      ALLOWED_ORIGINS: ${APP_URL:?APP_URL is required}
      DEMO_MODE: "false"
      MAX_CONCURRENT_USERS: ${MAX_CONCURRENT_USERS:-100}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      SUPERUSER_EMAILS: ${SUPERUSER_EMAILS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-NexoCam <noreply@nexocam.local>}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexocam}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-nexocam}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL:?LIVEKIT_PUBLIC_URL is required}
      LIVEKIT_INTERNAL_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-nexocam-evidence}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      EVIDENCE_ENCRYPTION_KEY: ${EVIDENCE_ENCRYPTION_KEY:?EVIDENCE_ENCRYPTION_KEY is required}
      MODERATION_SERVICE_TOKEN: ${MODERATION_SERVICE_TOKEN:?MODERATION_SERVICE_TOKEN is required}
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      livekit:
        condition: service_started
    restart: unless-stopped
    networks:
      - nexocam
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  moderation:
    build:
      context: .
      dockerfile: services/moderation/Dockerfile
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
      API_INTERNAL_URL: http://app:3001
      MODERATION_SERVICE_TOKEN: ${MODERATION_SERVICE_TOKEN:?MODERATION_SERVICE_TOKEN is required}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-nexocam-evidence}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      EVIDENCE_ENCRYPTION_KEY: ${EVIDENCE_ENCRYPTION_KEY:?EVIDENCE_ENCRYPTION_KEY is required}
      SAMPLE_SECONDS: ${SAMPLE_SECONDS:-3}
      NSFW_WARNING_THRESHOLD: ${NSFW_WARNING_THRESHOLD:-0.68}
      NSFW_STRONG_THRESHOLD: ${NSFW_STRONG_THRESHOLD:-0.88}
      MAX_CONCURRENT_INFERENCE: ${MAX_CONCURRENT_INFERENCE:-2}
      ONNX_THREADS: ${ONNX_THREADS:-2}
      HEALTH_PORT: "8081"
    expose:
      - "8081"
    depends_on:
      app:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      livekit:
        condition: service_started
    restart: unless-stopped
    networks:
      - nexocam
    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 3G
    logging: *default-logging

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexocam}
      POSTGRES_USER: ${POSTGRES_USER:-nexocam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks:
      - nexocam
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
    logging: *default-logging

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks:
      - nexocam
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768M
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes:
      - minio-data:/data
    expose:
      - "9000"
      - "9001"
    restart: unless-stopped
    networks:
      - nexocam
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
    logging: *default-logging

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-nexocam-evidence}
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}";
        do sleep 2;
        done;
        mc mb --ignore-existing "local/$${S3_BUCKET}";
        mc anonymous set none "local/$${S3_BUCKET}";
        mc ilm rule add --expire-days 30 "local/$${S3_BUCKET}" || true
    restart: "no"
    networks:
      - nexocam
    logging: *default-logging

  livekit:
    image: livekit/livekit-server:v1.13.4
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - "0.0.0.0"
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        turn:
          enabled: true
          udp_port: 3478
          relay_range_start: 50000
          relay_range_end: 50100
        redis:
          address: redis:6379
          password: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
        keys:
          "${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}": "${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}"
        room:
          auto_create: false
          empty_timeout: 60
          max_participants: 3
        logging:
          level: info
    expose:
      - "7880"
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
      - "3478:3478/udp"
      - "50000-50100:50000-50100/udp"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nexocam
    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 4G
    logging: *default-logging

networks:
  nexocam:

volumes:
  postgres-data:
  redis-data:
  minio-data:
